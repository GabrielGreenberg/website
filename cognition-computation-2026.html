<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GQ900QDSEE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GQ900QDSEE');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognition &amp; Computation (2026)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            background: #fff;
        }
        body {
            font-family: 'Open Sans', sans-serif;
            font-size: 16px;
            line-height: 26px;
            color: #3f3f3f;
        }
        a {
            color: #1382d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* ============ BANNER ============ */
        .banner {
            background: url(images/sun.jpg) no-repeat;
            background-position: top center;
            background-size: 100% auto;
            min-height: 340px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }
        .banner h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 72px;
            letter-spacing: 1px;
            color: #f5f5f5;
            text-align: center;
            margin: 0;
            line-height: 1.1;
        }

        /* ============ CONTENT ============ */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 50px 15px 70px 15px;
        }
        .row {
            display: flex;
            gap: 30px;
        }
        .col-left {
            width: 28.8%;
            flex-shrink: 0;
        }
        .col-right {
            flex: 1;
            min-width: 0;
        }
        .section-label {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.3;
            color: #3f3f3f;
        }
        .styled-hr {
            border: none;
            border-top: 1px solid rgba(0, 0, 0, 0.13);
            margin: 35px 0;
        }
        .session-title {
            font-weight: 700;
            color: #3f3f3f;
        }
        .session-date {
            color: rgb(36, 103, 141);
        }
        .handout a {
            font-weight: 700;
        }
        .reading-label {
            font-weight: 700;
            margin-top: 20px;
        }
        .reading-label:first-child {
            margin-top: 0;
        }
        .col-right p {
            margin: 0 0 10px 0;
        }
        .col-right p:last-child {
            margin-bottom: 0;
        }
        ul.readings {
            margin: 5px 0 0 0;
            padding-left: 28px;
        }
        ul.readings li {
            margin-bottom: 2px;
        }

        /* ============ RESPONSIVE ============ */
        @media screen and (max-width: 900px) {
            .banner h1 {
                font-size: 48px;
            }
        }
        @media screen and (max-width: 768px) {
            .banner {
                min-height: 240px;
            }
            .banner h1 {
                font-size: 36px;
            }
            .container {
                padding: 30px 15px 50px 15px;
            }
            .row {
                flex-direction: column;
                gap: 12px;
            }
            .col-left {
                width: 100%;
            }
            .section-label {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <header class="banner">
        <h1 id="banner-title">Cognition &amp; Computation</h1>
    </header>

    <div class="container" id="course-container">
        <!-- Content rendered from cognition-computation-2026.json -->
    </div>

    <script>
        fetch('cognition-computation-2026.json')
            .then(response => response.json())
            .then(data => renderCourse(data))
            .catch(error => {
                console.error('Error loading course data:', error);
                document.getElementById('course-container').innerHTML =
                    '<p>Error loading course data.</p>';
            });

        function renderReading(reading) {
            // Either a pre-formatted html string, or structured fields
            if (reading.html) {
                return `<li>${reading.html}</li>`;
            }
            let citation = '';
            if (reading.author) {
                citation += reading.author;
            }
            if (reading.year) {
                citation += ` (${reading.year})`;
            }
            let title = reading.title || '';
            if (reading.style === 'quotes') {
                title = `&ldquo;${title}&rdquo;`;
            } else if (title) {
                title = `<em>${title}</em>`;
            }
            if (reading.url && title) {
                title = `<a href="${reading.url}">${title}</a>`;
            }
            return `<li>${citation} ${title}</li>`;
        }

        function renderCourse(data) {
            const c = data.course;
            let html = '';

            // ============ ABOUT ============
            html += '<div class="row">';
            html += '<div class="col-left"><div class="section-label">ABOUT</div></div>';
            html += '<div class="col-right"><p>';
            html += `${c.instructor}<br>`;
            html += `${c.listing} &bull; ${c.term} &bull; ${c.institution}<br>`;
            if (c.when) html += `<strong>When:</strong> ${c.when}<br>`;
            if (c.where) html += `<strong>Where:</strong> ${c.where}`;
            html += '</p></div>';
            html += '</div>';

            html += '<hr class="styled-hr">';

            // ============ SYLLABUS ============
            html += '<div class="row">';
            html += '<div class="col-left"><div class="section-label">SYLLABUS</div></div>';
            html += '<div class="col-right">';
            if (c.syllabusUrl) {
                html += `<p><a href="${c.syllabusUrl}">Syllabus</a></p>`;
            }
            html += `<p${c.syllabusUrl ? ' style="margin-top: 20px;"' : ''}><strong>Course description:</strong> ${c.description}</p>`;
            html += '</div>';
            html += '</div>';

            // ============ SESSIONS ============
            data.sessions.forEach(session => {
                html += '<hr class="styled-hr">';
                html += '<div class="row">';
                html += '<div class="col-left">';
                html += `<div class="session-title">${session.number}. ${session.title}</div>`;
                if (session.date) {
                    html += `<div class="session-date">${session.date}</div>`;
                }
                html += '</div>';
                html += '<div class="col-right">';
                if (session.handouts && session.handouts.length > 0) {
                    html += '<div class="handout">';
                    html += session.handouts
                        .map(h => `<a href="${h.url}">${h.label || 'Handout'}</a>`)
                        .join('<br>');
                    html += '</div>';
                }
                if (session.readings && session.readings.length > 0) {
                    html += '<div class="reading-label">Reading:</div>';
                    html += '<ul class="readings">';
                    session.readings.forEach(r => { html += renderReading(r); });
                    html += '</ul>';
                }
                html += '</div>';
                html += '</div>';
            });

            document.getElementById('course-container').innerHTML = html;
        }
    </script>
</body>
</html>
